name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['7.4', '8.1', '8.4']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Install the pinned converter (downloaded from html2pdf-core and verified)
        run: php bin/html2pdf-install
      - name: Tests
        run: vendor/bin/phpunit
        env:
          HTML2PDF_NO_DOWNLOAD: '1' # use the binary installed above

  checks:
    name: PHPStan and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer analyse
      - run: sh scripts/check-versions.sh
