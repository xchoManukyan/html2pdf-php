name: Release

# Pushing a tag such as v0.2.0 checks the version numbers and that
# resources/binaries.json equals the checksums.json of the pinned
# html2pdf-core release, then creates the GitHub release. Packagist picks up
# the tag. See CONTRIBUTING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version numbers match the tag
        run: sh scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - name: Pinned checksums are the converter release's
        run: |
          core=$(sed -n 's/.*"version": *"\(.*\)".*/\1/p' resources/binaries.json)
          curl -fsSL "https://github.com/xchoManukyan/html2pdf-core/releases/download/v$core/checksums.json" -o core.json
          diff resources/binaries.json core.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
