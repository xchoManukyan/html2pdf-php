<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bootstrap 4 components</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <a class="navbar-brand" href="#">Acme Travel</a>
  <ul class="navbar-nav mr-auto">
    <li class="nav-item active"><a class="nav-link" href="#">Home</a></li>
    <li class="nav-item"><a class="nav-link" href="#">Prices</a></li>
  </ul>
</nav>
<div class="container py-4">
  <h1 class="display-4">Bootstrap 4</h1>
  <p class="lead">Components with the version 4 class names.</p>
  <div class="row mb-3">
    <div class="col-md-8"><div class="p-3 bg-light border rounded">col-md-8</div></div>
    <div class="col-md-4"><div class="p-3 bg-info text-white rounded">col-md-4</div></div>
  </div>
  <p><button class="btn btn-primary">Primary</button> <button class="btn btn-outline-secondary">Outline</button>
    <span class="badge badge-pill badge-success">Paid</span> <span class="badge badge-warning">Pending</span></p>
  <div class="alert alert-info">A version 4 alert with <a href="#" class="alert-link">a link</a>.</div>
  <div class="card-deck mb-3">
    <div class="card"><div class="card-header">10-day</div><div class="card-body"><h5 class="card-title">€12.30</h5><p class="card-text">Ten consecutive days.</p></div></div>
    <div class="card border-success"><div class="card-body"><h5 class="card-title">30-day</h5><p class="card-text">For longer trips.</p></div></div>
  </div>
  <table class="table table-striped table-sm">
    <thead class="thead-dark"><tr><th>#</th><th>Vignette</th><th class="text-right">Price</th></tr></thead>
    <tbody><tr><td>1</td><td>10-day</td><td class="text-right">€12.30</td></tr><tr><td>2</td><td>30-day</td><td class="text-right">€17.10</td></tr></tbody>
  </table>
  <form>
    <div class="form-row">
      <div class="form-group col-md-6"><label for="a">Email</label><input class="form-control" id="a" value="alex@example.com"></div>
      <div class="form-group col-md-6"><label for="b">Country</label><select class="custom-select" id="b"><option selected>Slovakia</option></select></div>
    </div>
    <div class="custom-control custom-checkbox"><input type="checkbox" class="custom-control-input" id="c" checked><label class="custom-control-label" for="c">Send the invoice</label></div>
  </form>
</div>
</body>
</html>
